# vnpy_app is an application directory, not a distributable package — there is
# no [project]/[build-system] table because nothing builds a wheel from it.
# This file exists so `ruff check` has a config of its own.
#
# Without a [tool.ruff] table here, ruff walks up the filesystem and picks up
# whatever config it finds in the *parent* directory — a different git
# repository — so `ruff check` answered differently depending on where this
# clone happened to live. Same reasoning as vnpy_alphakit's pyproject.toml,
# and the settings below deliberately mirror it.

[tool.ruff]
target-version = "py310"
line-length = 100
output-format = "full"

[tool.ruff.lint]
# CLAUDE.md §13.25: style findings are bugs, and the rule set is fixed at
# E,W,F,B,SIM,UP,I. Narrowing the select list is how a package reports a
# clean run it has not earned.
select = [
    "B",    # flake8-bugbear
    "E",    # pycodestyle error
    "F",    # pyflakes
    "I",    # isort
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warning
]

[tool.ruff.lint.isort]
known-first-party = [
    "data_tools",
    "fluent_ui",
    "replay_chart",
    "run",
    "run_gui",
    "run_live_alpha",
    "strategies",
    "strategy_state",
]

# ---------------------------------------------------------------------------
# TODO(ruff-debt): pre-existing findings, fenced per file so they neither
# block work nor disappear.
#
# The select list above went in after these files were written, so turning it
# on produced 76 findings at once. Silencing them globally (`ignore = [...]`)
# would switch the rule off for new code as well, which is the outcome this
# config exists to prevent. Listing them per file instead means:
#
#   * every file below is capped at the rules it *already* violates — a new
#     violation of any other rule in it still fails;
#   * a file not listed below is held to the full rule set, so new files and
#     the cleaned-up ones cannot regress;
#   * the debt is enumerated rather than hidden, and each entry disappears the
#     moment someone fixes that file.
#
# Paying it down: run `ruff check --fix` for the mechanical ones (I001, F401,
# UP035/UP037, B033, SIM117), then delete the entry. E501/E402 need judgement
# and are mostly in the Qt UI layer.
# ---------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
"fluent_ui/backtester_metrics.py" = ["I001"]
"fluent_ui/cells.py" = ["E501", "I001"]
"fluent_ui/chart_wizard.py" = ["E402", "E501", "I001"]
"fluent_ui/connect_dialog.py" = ["E501", "I001"]
"fluent_ui/contract_manager.py" = ["B033", "I001", "SIM108"]
"fluent_ui/data_manager.py" = ["E501", "F401", "I001", "SIM113"]
"fluent_ui/gateway_config.py" = ["E501", "I001", "SIM117"]
"fluent_ui/home_widget.py" = ["I001", "UP035"]
"fluent_ui/mainwindow.py" = ["E501", "I001"]
"fluent_ui/monitor.py" = ["E501", "I001"]
"fluent_ui/pivot_widget.py" = ["I001"]
"fluent_ui/searchable_combo_box.py" = ["I001"]
"fluent_ui/session_candle.py" = ["I001"]
"fluent_ui/trading_widget.py" = ["E501", "I001"]
"replay_chart.py" = ["E501"]
"run.py" = ["I001"]
"run_gui.py" = ["I001"]
"strategies/long_only_turtle_strategy.py" = ["I001"]
"tests/test_backtester_metrics.py" = ["I001"]
"tests/test_bulk_import.py" = ["I001"]
"tests/test_chart_wizard_period_switch.py" = ["E501", "I001", "UP037"]
"tests/test_long_only_turtle.py" = ["E501", "F401", "I001"]
"tests/test_run_headless_gate_wiring.py" = ["I001"]
"tests/test_run_live_alpha.py" = ["I001"]

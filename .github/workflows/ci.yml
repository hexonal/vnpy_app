name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # PySide6 的 .so 在链接期就要 libEGL / libGL，即使跑 offscreen 平台也一样
      # （offscreen 只是不建窗口，不是不加载图形库）。ubuntu runner 默认没装，
      # 症状是 import 阶段 ImportError: libEGL.so.1: cannot open shared object file。
      - name: Install system libs for PySide6
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # lint 排在装依赖之前：它不需要任何依赖，装依赖失败时仍能给出信号。
      # 规则集与目标版本都钉在本仓 pyproject.toml 的 [tool.ruff] 里，不靠这里的
      # 命令行参数，也不会沿目录树往上读到别的仓的配置。
      - name: Lint
        run: ruff check .

      # 这些 checkout 必须排在 Lint 之后：它们把别的仓解到 _deps/ 里，
      # 而 `ruff check .` 是对整个工作目录跑的，提前解出来就会去 lint 兄弟仓。
      # 兄弟仓已全部公开，checkout 用 runner 自带的 GITHUB_TOKEN 即可，
      # 不再需要人工配 PAT。private 时代的 HAS_TOKEN 门禁已移除 ——
      # 那道门禁的代价是所有测试被 skip，绿灯只代表 lint 过。
      - name: Checkout sibling repos
        uses: actions/checkout@v7
        with:
          repository: hexonal/vnpy_gatewaykit
          path: _deps/vnpy_gatewaykit

      # fluent_ui 直接 import 的私有兄弟包不止 gatewaykit：vnpy 本体（fork）、
      # ctastrategy（闸/分段）、alphakit（install_gate_rules）、futu/usmart
      # 两个网关。少一个，Type check 与 Test 就会以 import 错误红着，而不是
      # 因为本仓代码真有问题。
      - name: Checkout vnpy fork
        uses: actions/checkout@v7
        with:
          repository: hexonal/vnpy
          path: _deps/vnpy

      - name: Checkout vnpy_ctastrategy
        uses: actions/checkout@v7
        with:
          repository: hexonal/vnpy_ctastrategy
          path: _deps/vnpy_ctastrategy

      - name: Checkout vnpy_alphakit
        uses: actions/checkout@v7
        with:
          repository: hexonal/vnpy_alphakit
          path: _deps/vnpy_alphakit

      - name: Checkout vnpy_futu
        uses: actions/checkout@v7
        with:
          repository: hexonal/vnpy_futu
          path: _deps/vnpy_futu

      # tests/test_run_headless_gate_wiring.py 按 run.py 的真实装载顺序接线，
      # 其中包含 AgentBridge（LLM Agent 下单走的那条路），所以它是测试的硬依赖。
      - name: Checkout vnpy_agentbridge
        uses: actions/checkout@v7
        with:
          repository: hexonal/vnpy_agentbridge
          path: _deps/vnpy_agentbridge


      # 没有 `pip install -e .` 这一步：vnpy_app 是应用目录不是发行包，
      # pyproject.toml 里没有 [project]/[build-system]，装不了也不该装。
      # 测试自己往 sys.path 塞了仓根（见 tests/*.py 顶部），import 得到
      # fluent_ui / strategies / data_tools。
      - name: Install package
        run: |
          # vnpy_sqlite：vnpy 的默认数据库驱动，get_database() 运行时按名加载，
          # 不在任何 install_requires 里，但回测面板一初始化就要它。
          pip install mypy pytest pytest-timeout vnpy_sqlite
          pip install -e "./_deps/vnpy[alpha]"
          pip install -e _deps/vnpy_gatewaykit
          pip install -e _deps/vnpy_ctastrategy
          pip install -e _deps/vnpy_alphakit
          pip install -e _deps/vnpy_futu
          pip install -e _deps/vnpy_agentbridge
          # 公开的 App/网关/UI 依赖，PyPI 直接装。
          pip install \
            PySide6 \
            "PySide6-Fluent-Widgets" \
            pyqtgraph \
            tzlocal \
            psycopg \
            vnpy_chartwizard \
            vnpy_ctabacktester \
            vnpy_datamanager \
            vnpy_paperaccount \
            vnpy_riskmanager

      - name: Type check
        run: mypy --strict fluent_ui

      # 这一步是本 workflow 存在的主要理由：vnpy 与 vnpy_ctastrategy 的既有 CI
      # 只跑 ruff/mypy/build，一个用例都不执行。
      #
      # QT_QPA_PLATFORM=offscreen：fluent_ui 全是 Qt widget，用例要真的
      # create_qapp() 并 grab() 位图，而 runner 上没有 X/Wayland；不设这个
      # 变量，Qt 找不到平台插件会直接 abort（不是抛异常，抓不到）。
      # 用 offscreen 而不是 xvfb，是因为本仓测试已经按无显示环境写好了
      # （tests/*.py 顶部自己 setdefault 了同一个变量，见
      # tests/test_fluent_offscreen_guard.py 与 README「无显示环境下不能用
      # FluentMainWindow」一节）。
      # --timeout：本仓的 Qt 用例在 runner 上曾把 Test 步骤挂到 31 分钟
      # （本地只要 70 秒），而没有超时的 job 会一直烧时间且看不出卡在哪一条。
      # 单条 120s 足够宽（最慢的 offscreen 子进程用例自带 timeout=120），
      # 超时会打印那一条的名字与栈，把「卡住」变成可定位的失败。
      - name: Test
        # timeout-minutes 是兜底：pytest-timeout 只能打断**用例函数体**里的卡住，
        # 对收集阶段、fixture 拆解、以及「用例都跑完但进程不退出」(残留非 daemon
        # 线程 / Qt 事件循环没停) 一律无效 —— 上一轮 9 分钟仍在跑就证明卡点不在
        # 函数体内。步骤级超时会把 job 杀掉并让日志可读，把「永远挂着」变成
        # 「10 分钟后失败且看得到停在哪」。
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q --timeout=60 --timeout-method=thread -v

